{% extends "base.html" %}
{% block title %}{{ kod }} — DataPortal{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh;text-align:center;">
  <div style="font-size:5rem;font-weight:800;background:linear-gradient(135deg,var(--danger),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;">{{ kod }}</div>
  <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:10px;">{{ mesaj }}</h1>
  <p style="color:var(--muted);font-size:0.9rem;max-width:400px;line-height:1.6;margin-bottom:28px;">{{ aciklama }}</p>
  <div style="display:flex;gap:10px;">
    <a href="javascript:history.back()" class="btn btn-ghost">← Geri Dön</a>
    <a href="/dashboard" class="btn btn-primary">Dashboard'a Git</a>
  </div>
</div>
{% endblock %}
